<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Accountability to the Core</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page-wrap">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="images/accountability_to_the_core2.png" alt="AC Logo" width="52" height="52">
        </div>
        <h1 class="auth-title">Accountability to the Core</h1>
        <p class="auth-subtitle">Citizens' Oversight Platform</p>

        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">Sign In</button>
            <button class="auth-tab" data-tab="register">Create Account</button>
        </div>

        <div id="loginPanel">
            <div class="form-error" id="loginError"></div>
            <form id="loginForm">
                <div class="field-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" class="input-element" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="field-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" class="input-element" placeholder="Your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-report btn-block">Sign In</button>
            </form>
        </div>

        <div id="registerPanel" class="panel-hidden">
            <div class="form-error" id="registerError"></div>
            <div class="form-success" id="registerSuccess"></div>
            <form id="registerForm">
                <div class="field-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" class="input-element" placeholder="e.g. John Doe" required autocomplete="name">
                </div>
                <div class="field-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" class="input-element" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="field-group">
                    <label>Password (min 6 characters)</label>
                    <input type="password" id="regPassword" class="input-element" placeholder="Choose a strong password" required autocomplete="new-password">
                </div>
                <div class="field-group">
                    <label>Confirm Password</label>
                    <input type="password" id="regConfirm" class="input-element" placeholder="Repeat your password" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-report btn-block">Create Account</button>
            </form>
        </div>

        <div class="form-footer-link">
            <a href="index.html">← Back to platform</a>
        </div>
    </div>

    <script src="js/router.js"></script>
    <script src="js/user-auth.js"></script>
</body>
</html>
